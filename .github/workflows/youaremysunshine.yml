name: Remote Desktop
run-name: ${{ inputs.os }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Host operating system"
        type: choice
        required: true
        default: "ubuntu-latest"
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

jobs:
  sunshine:
    name: Sunshine
    runs-on: ${{ inputs.os }}

    steps:

      # ============================================================
      # LINUX DISPLAY
      # ============================================================

      - name: Setup Linux display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            xvfb \
            icewm \
            pulseaudio \
            pulseaudio-utils

          read -r DISPLAY_NUMBER < <(
            Xvfb \
              -displayfd 1 \
              -screen 0 1920x1080x24 \
              +extension XTEST \
              +extension XFIXES \
              -nolisten tcp
          )

          export DISPLAY=":$DISPLAY_NUMBER"
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"

          icewm-session \
            > "$RUNNER_TEMP/icewm.log" 2>&1 &

          pulseaudio \
            --start \
            --exit-idle-time=-1


      # ============================================================
      # INSTALL SUNSHINE
      # ============================================================

      - name: Install Sunshine
        run: |
          case "$RUNNER_OS" in
            Linux)
              curl -1sLf \
                'https://dl.cloudsmith.io/public/lizardbyte/stable/cfg/setup/bash.deb.sh' \
                | sudo -E bash

              sudo apt-get update
              sudo apt-get install -y sunshine
              ;;

            macOS)
              brew install LizardByte/homebrew/sunshine
              ;;

            Windows)
              curl.exe -L \
                -o "$RUNNER_TEMP/sunshine.msi" \
                "https://github.com/LizardByte/Sunshine/releases/latest/download/Sunshine-Windows-AMD64-installer.msi"

              msiexec.exe \
                /i "$RUNNER_TEMP/sunshine.msi" \
                /quiet \
                /norestart
              ;;
          esac


      # ============================================================
      # INSTALL TAILSCALE
      # ============================================================

      - name: Install Tailscale
        run: |
          case "$RUNNER_OS" in
            Linux)
              curl -fsSL https://tailscale.com/install.sh | sh
              ;;

            macOS)
              brew install --quiet --cask tailscale
              ;;

            Windows)
              curl.exe -L \
                -o "$RUNNER_TEMP/tailscale.exe" \
                "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"

              "$RUNNER_TEMP/tailscale.exe" /quiet
              ;;
          esac


      # ============================================================
      # TAILSCALE LOGIN
      # ============================================================

      - name: Login to Tailscale
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            TAILSCALE="C:/Program Files/Tailscale/tailscale.exe"
          else
            TAILSCALE="tailscale"
          fi

          echo
          echo "=============================================="
          echo "          TAILSCALE LOGIN REQUIRED"
          echo "=============================================="
          echo
          echo "Open the login URL printed below."
          echo

          "$TAILSCALE" up

          echo
          echo "Tailscale login completed."


      # ============================================================
      # SUNSHINE CONFIG
      # ============================================================

      - name: Configure Sunshine
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux|macOS)
              CONFIG_DIR="$HOME/.config/sunshine"
              ;;

            Windows)
              CONFIG_DIR="$PROGRAMFILES/Sunshine/config"
              ;;
          esac

          mkdir -p "$CONFIG_DIR"

          cat > "$CONFIG_DIR/sunshine.conf" <<'EOF'
          encoder = software
          sw_preset = ultrafast
          sw_tune = zerolatency
          stream_audio = enabled
          EOF

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "capture = x11" >> "$CONFIG_DIR/sunshine.conf"
          fi


      # ============================================================
      # START SUNSHINE
      # ============================================================

      - name: Start Sunshine
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sunshine="C:/Program Files/Sunshine/sunshine.exe"

            powershell.exe -NoProfile -Command \
              "Start-Process '$sunshine' -WindowStyle Hidden"

          else
            sunshine \
              > "$RUNNER_TEMP/sunshine.log" 2>&1 &

            sleep 10

            cat "$RUNNER_TEMP/sunshine.log" || true
          fi


      # ============================================================
      # SHOW CONNECTION INFO
      # ============================================================

      - name: Show connection information
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            TAILSCALE="C:/Program Files/Tailscale/tailscale.exe"
          else
            TAILSCALE="tailscale"
          fi

          echo
          echo "=============================================="
          echo "           REMOTE DESKTOP READY"
          echo "=============================================="
          echo
          echo "Tailscale IPv4:"
          "$TAILSCALE" ip -4
          echo
          echo "Enter this IP into Moonlight."
          echo
          echo "=============================================="


      # ============================================================
      # KEEP RUNNER ALIVE
      # ============================================================

      - name: Keep Sunshine alive
        run: |
          echo "Sunshine host is running."
          echo "Waiting for Moonlight..."

          sleep 21600
