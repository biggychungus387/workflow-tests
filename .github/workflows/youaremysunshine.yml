name: Remote Desktop
run-name: ${{ inputs.os }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Host operating system"
        type: choice
        required: true
        default: "ubuntu-latest"
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

jobs:
  sunshine:
    name: Sunshine
    runs-on: ${{ inputs.os }}

    steps:
      - name: Setup Linux desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            icewm \
            pulseaudio \
            pulseaudio-utils

          read -r DISPLAY_NUMBER < <(
            Xvfb -displayfd 1 \
              -screen 0 1920x1080x24 \
              +extension XTEST \
              +extension XFIXES \
              -nolisten tcp
          )

          export DISPLAY=":$DISPLAY_NUMBER"
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"

          icewm-session > "$RUNNER_TEMP/icewm.log" 2>&1 &

          pulseaudio --start --exit-idle-time=-1

      - name: Install Sunshine
        run: |
          case "$RUNNER_OS" in
            Linux)
              curl -1sLf \
                'https://dl.cloudsmith.io/public/lizardbyte/stable/cfg/setup/bash.deb.sh' \
                | sudo -E bash

              sudo apt-get update
              sudo apt-get install -y sunshine

              sudo setcap -r "$(readlink -f "$(which sunshine)")"
              ;;

            macOS)
              ARCH="$(uname -m)"

              if [[ "$ARCH" != "arm64" ]]; then
                echo "Expected Apple Silicon macOS runner, got: $ARCH"
                exit 1
              fi

              curl -fL \
                -o "$RUNNER_TEMP/Sunshine.dmg" \
                "https://github.com/LizardByte/Sunshine/releases/latest/download/Sunshine-macOS-arm64.dmg"

              hdiutil attach \
                "$RUNNER_TEMP/Sunshine.dmg" \
                -nobrowse \
                -readonly

              MOUNT_POINT="$(
                hdiutil info |
                awk '/Sunshine/ && /Volumes/ {print $3; exit}'
              )"

              sudo rm -rf "/Applications/Sunshine.app"
              sudo cp -R \
                "$MOUNT_POINT/Sunshine.app" \
                "/Applications/Sunshine.app"

              hdiutil detach "$MOUNT_POINT"
              ;;

            Windows)
              curl.exe -L \
                -o "$RUNNER_TEMP/sunshine.msi" \
                "https://github.com/LizardByte/Sunshine/releases/latest/download/Sunshine-Windows-AMD64-installer.msi"

              msiexec.exe \
                /i "$RUNNER_TEMP/sunshine.msi" \
                /quiet \
                /norestart
              ;;
          esac

      - name: Install Tailscale
        run: |
          case "$RUNNER_OS" in
            Linux)
              curl -fsSL https://tailscale.com/install.sh | sh
              sudo systemctl enable --now tailscaled
              ;;

            macOS)
              brew install tailscale
              sudo brew services start tailscale
              sleep 3
              sudo tailscale version
              ;;

            Windows)
              curl.exe -L \
                -o "$RUNNER_TEMP/tailscale.msi" \
                "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

              msiexec.exe \
                /i "$RUNNER_TEMP/tailscale.msi" \
                /quiet \
                /norestart
              ;;
          esac

      - name: Connect to Tailscale
        env:
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          echo "Connecting this runner to Tailscale..."

          sudo tailscale up \
            --auth-key="$TS_OAUTH_SECRET" \
            --advertise-tags=tag:ci

          sudo tailscale wait --timeout=30s

          TAILSCALE_IP="$(sudo tailscale ip -4)"

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"

          echo "Tailscale connected."
          echo "IPv4: $TAILSCALE_IP"

      - name: Configure Sunshine
        run: |
          case "$RUNNER_OS" in
            Linux|macOS)
              CONFIG_DIR="$HOME/.config/sunshine"
              ;;

            Windows)
              CONFIG_DIR="$(cygpath "$PROGRAMFILES")/Sunshine/config"
              ;;
          esac

          mkdir -p "$CONFIG_DIR"

          cat > "$CONFIG_DIR/sunshine.conf" <<EOF
          encoder = software
          sw_preset = ultrafast
          sw_tune = zerolatency
          stream_audio = enabled
          csrf_allowed_origins = https://$TAILSCALE_IP:47990
          EOF

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "capture = x11" >> "$CONFIG_DIR/sunshine.conf"
          fi

      - name: Start Sunshine
        run: |
          case "$RUNNER_OS" in
            Linux)
              sunshine > "$RUNNER_TEMP/sunshine.log" 2>&1 &
              sleep 10
              ;;

            macOS)
              /Applications/Sunshine.app/Contents/MacOS/sunshine \
                > "$RUNNER_TEMP/sunshine.log" 2>&1 &
              sleep 10
              ;;

            Windows)
              powershell.exe -NoProfile -Command \
                "Start-Service Sunshine"

              Start-Sleep -Seconds 10
              ;;
          esac

          echo "========== Sunshine =========="
          cat "$RUNNER_TEMP/sunshine.log" 2>/dev/null || true
          echo "=============================="

      - name: Show connection information
        run: |
          echo
          echo "=============================================="
          echo "           REMOTE DESKTOP READY"
          echo "=============================================="
          echo
          echo "Tailscale IPv4:"
          echo "$TAILSCALE_IP"
          echo
          echo "Sunshine Web UI:"
          echo "https://$TAILSCALE_IP:47990"
          echo
          echo "Then pair Moonlight through the Web UI."
          echo
          echo "=============================================="

      - name: Keep runner alive
        run: |
          echo "Sunshine host is running."
          echo "Waiting for Moonlight..."
          sleep 21600
