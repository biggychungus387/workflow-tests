name: Remote Desktop

run-name: ${{ inputs.os }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Host operating system"
        type: choice
        required: true
        default: "ubuntu-latest"
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

jobs:
  sunshine:
    name: Sunshine
    runs-on: ${{ inputs.os }}

    steps:

      # ─────────────────────────────────────────────
      # Linux virtual desktop + audio
      # ─────────────────────────────────────────────

      - name: Setup Linux desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            xvfb \
            icewm \
            pulseaudio \
            pulseaudio-utils

          read -r DISPLAY_NUMBER < <(
            Xvfb \
              -displayfd 1 \
              -screen 0 1920x1080x24 \
              +extension XTEST \
              +extension XFIXES \
              -nolisten tcp
          )

          export DISPLAY=":$DISPLAY_NUMBER"
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"

          icewm-session \
            > "$RUNNER_TEMP/icewm.log" 2>&1 &

          pulseaudio \
            --start \
            --exit-idle-time=-1


      # ─────────────────────────────────────────────
      # Install Sunshine
      # ─────────────────────────────────────────────

      - name: Install Sunshine
        run: |
          case "$RUNNER_OS" in

            Linux)
              curl -1sLf \
                'https://dl.cloudsmith.io/public/lizardbyte/stable/cfg/setup/bash.deb.sh' \
                | sudo -E bash

              sudo apt-get update
              sudo apt-get install -y sunshine

              # We are using X11 capture rather than KMS.
              sudo setcap -r "$(readlink -f "$(which sunshine)")"
              ;;

            macOS)
              ARCH="$(uname -m)"

              if [[ "$ARCH" != "arm64" ]]; then
                echo "Expected Apple Silicon macOS runner, got: $ARCH"
                exit 1
              fi

              curl -fL \
                -o "$RUNNER_TEMP/Sunshine.dmg" \
                "https://github.com/LizardByte/Sunshine/releases/latest/download/Sunshine-macOS-arm64.dmg"

              hdiutil attach \
                "$RUNNER_TEMP/Sunshine.dmg" \
                -nobrowse \
                -readonly

              MOUNT_POINT="$(
                hdiutil info |
                  awk '/Sunshine/ && /Volumes/ {print $3; exit}'
              )"

              sudo rm -rf "/Applications/Sunshine.app"

              sudo cp -R \
                "$MOUNT_POINT/Sunshine.app" \
                "/Applications/Sunshine.app"

              hdiutil detach "$MOUNT_POINT"
              ;;

            Windows)
              curl.exe -L \
                -o "$RUNNER_TEMP/sunshine.msi" \
                "https://github.com/LizardByte/Sunshine/releases/latest/download/Sunshine-Windows-AMD64-installer.msi"

              msiexec.exe \
                /i "$RUNNER_TEMP/sunshine.msi" \
                /quiet \
                /norestart
              ;;

          esac


      # ─────────────────────────────────────────────
      # Install Tailscale
      # ─────────────────────────────────────────────

      - name: Install Tailscale
        run: |
          case "$RUNNER_OS" in

            Linux)
              curl -fsSL \
                https://tailscale.com/install.sh \
                | sh

              sudo systemctl enable --now tailscaled
              ;;

            macOS)
              brew install tailscale

              sudo brew services start tailscale

              # Give launchd a moment to start tailscaled.
              sleep 3

              sudo tailscale version
              ;;

            Windows)
              curl.exe -L \
                -o "$RUNNER_TEMP/tailscale.msi" \
                "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

              msiexec.exe \
                /i "$RUNNER_TEMP/tailscale.msi" \
                /quiet \
                /norestart
              ;;

          esac


      # ─────────────────────────────────────────────
      # Connect Tailscale
      # ─────────────────────────────────────────────

      - name: Connect to Tailscale
        env:
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          echo "Connecting this runner to Tailscale..."

          sudo tailscale up \
            --auth-key="$TS_OAUTH_SECRET" \
            --advertise-tags=tag:ci

          sudo tailscale set \
            --hostname="$GITHUB_RUN_ID"

          sudo tailscale wait --timeout=30s

          echo
          echo "Tailscale connected."
          echo "Host: $GITHUB_RUN_ID"
          echo "IPv4: $(sudo tailscale ip -4)"
          echo


      # ─────────────────────────────────────────────
      # Configure Sunshine
      # ─────────────────────────────────────────────

      - name: Configure Sunshine
        run: |
          case "$RUNNER_OS" in
            Linux|macOS)
              CONFIG_DIR="$HOME/.config/sunshine"
              ;;

            Windows)
              CONFIG_DIR="$(cygpath "$PROGRAMFILES")/Sunshine/config"
              ;;
          esac

          mkdir -p "$CONFIG_DIR"

          cat > "$CONFIG_DIR/sunshine.conf" <<'EOF'
          encoder = software
          sw_preset = ultrafast
          sw_tune = zerolatency
          stream_audio = enabled
          EOF

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "capture = x11" >> "$CONFIG_DIR/sunshine.conf"
          fi


      # ─────────────────────────────────────────────
      # Start Sunshine
      # ─────────────────────────────────────────────

      - name: Start Sunshine
        run: |
          case "$RUNNER_OS" in

            Linux)
              sunshine \
                > "$RUNNER_TEMP/sunshine.log" 2>&1 &

              sleep 10
              ;;

            macOS)
              /Applications/Sunshine.app/Contents/MacOS/sunshine \
                > "$RUNNER_TEMP/sunshine.log" 2>&1 &

              sleep 10
              ;;

            Windows)
              powershell.exe -NoProfile -Command \
                "Start-Service Sunshine"

              Start-Sleep -Seconds 10
              ;;

          esac

          echo "========== Sunshine =========="
          cat "$RUNNER_TEMP/sunshine.log" 2>/dev/null || true
          echo "=============================="


      # ─────────────────────────────────────────────
      # Show connection information
      # ─────────────────────────────────────────────

      - name: Show connection information
        run: |
          TAILSCALE_IP="$(sudo tailscale ip -4)"

          echo
          echo "=============================================="
          echo "           REMOTE DESKTOP READY"
          echo "=============================================="
          echo
          echo "Host:"
          echo "$GITHUB_RUN_ID"
          echo
          echo "Tailscale IPv4:"
          echo "$TAILSCALE_IP"
          echo
          echo "Sunshine Web UI:"
          echo "https://$TAILSCALE_IP:47990"
          echo
          echo "Open the Web UI above to finish Sunshine setup"
          echo "and approve the Moonlight pairing PIN."
          echo
          echo "Then enter this host in Moonlight:"
          echo "$TAILSCALE_IP"
          echo
          echo "=============================================="


      # ─────────────────────────────────────────────
      # Keep runner alive
      # ─────────────────────────────────────────────

      - name: Keep Sunshine alive
        run: |
          echo "Sunshine host is running."
          echo "Waiting for Moonlight..."

          sleep 21600
