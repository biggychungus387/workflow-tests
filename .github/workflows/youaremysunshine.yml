name: Remote Desktop

run-name: ${{ inputs.os }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Host operating system"
        type: choice
        required: true
        default: "ubuntu-latest"
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

jobs:
  sunshine:
    name: Sunshine
    runs-on: ${{ inputs.os }}

    steps:
      # ─────────────────────────────────────────────
      # Linux virtual desktop + audio
      # ─────────────────────────────────────────────

      - name: Setup Linux desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            xvfb \
            icewm \
            pulseaudio \
            pulseaudio-utils

          read -r DISPLAY_NUMBER < <(
            Xvfb \
              -displayfd 1 \
              -screen 0 1920x1080x24 \
              +extension XTEST \
              +extension XFIXES \
              -nolisten tcp
          )

          export DISPLAY=":$DISPLAY_NUMBER"
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"

          icewm-session \
            > "$RUNNER_TEMP/icewm.log" 2>&1 &

          pulseaudio \
            --start \
            --exit-idle-time=-1


      # ─────────────────────────────────────────────
      # Native Sunshine installation
      # ─────────────────────────────────────────────

      - name: Install Sunshine
        run: |
          case "$RUNNER_OS" in

            Linux)
              curl -1sLf \
                'https://dl.cloudsmith.io/public/lizardbyte/stable/cfg/setup/bash.deb.sh' \
                | sudo -E bash

              sudo apt-get update
              sudo apt-get install -y sunshine

              # We're using X11 capture, not KMS.
              sudo setcap -r "$(readlink -f "$(which sunshine)")"
              ;;

            macOS)
              brew trust --formula lizardbyte/homebrew/sunshine-beta
              brew install LizardByte/homebrew/sunshine
              ;;

            Windows)
              curl.exe -L \
                -o "$RUNNER_TEMP/sunshine.msi" \
                "https://github.com/LizardByte/Sunshine/releases/latest/download/Sunshine-Windows-AMD64-installer.msi"

              msiexec.exe \
                /i "$RUNNER_TEMP/sunshine.msi" \
                /quiet \
                /norestart
              ;;

          esac


      # ─────────────────────────────────────────────
      # Tailscale
      # ─────────────────────────────────────────────

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}


      # ─────────────────────────────────────────────
      # Sunshine configuration
      # ─────────────────────────────────────────────

      - name: Configure Sunshine
        run: |
          case "$RUNNER_OS" in
            Linux|macOS)
              CONFIG_DIR="$HOME/.config/sunshine"
              ;;

            Windows)
              CONFIG_DIR="$(cygpath "$PROGRAMFILES")/Sunshine/config"
              ;;
          esac

          mkdir -p "$CONFIG_DIR"

          cat > "$CONFIG_DIR/sunshine.conf" <<'EOF'
          encoder = software
          sw_preset = ultrafast
          sw_tune = zerolatency
          stream_audio = enabled
          EOF

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "capture = x11" >> "$CONFIG_DIR/sunshine.conf"
          fi


      # ─────────────────────────────────────────────
      # Start Sunshine
      # ─────────────────────────────────────────────

      - name: Start Sunshine
        run: |
          case "$RUNNER_OS" in

            Linux|macOS)
              sunshine \
                > "$RUNNER_TEMP/sunshine.log" 2>&1 &

              sleep 10

              echo "========== Sunshine =========="
              cat "$RUNNER_TEMP/sunshine.log" || true
              echo "=============================="
              ;;

            Windows)
              # The MSI installation provides Sunshine.
              powershell.exe -NoProfile -Command \
                "Start-Service Sunshine"

              Start-Sleep -Seconds 10

              powershell.exe -NoProfile -Command \
                "Get-Service Sunshine"
              ;;

          esac


      # ─────────────────────────────────────────────
      # Connection information
      # ─────────────────────────────────────────────

      - name: Show connection information
        run: |
          echo
          echo "=============================================="
          echo "           REMOTE DESKTOP READY"
          echo "=============================================="
          echo
          echo "Tailscale IPv4:"
          tailscale ip -4
          echo
          echo "Enter this IP into Moonlight."
          echo
          echo "=============================================="


      # ─────────────────────────────────────────────
      # Keep GitHub Actions runner alive
      # ─────────────────────────────────────────────

      - name: Keep Sunshine alive
        run: |
          echo "Sunshine host is running."
          echo "Waiting for Moonlight..."

          sleep 21600
