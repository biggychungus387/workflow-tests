name: MoQ WebRTC Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install @moq/net werift

      - name: Start host
        env:
          NODE_NO_WARNINGS: "1"
        run: |
          cat > host.mjs <<'EOF'
          import * as Moq from "@moq/net";
          import { RTCPeerConnection } from "werift";

          const RELAY = "https://cdn.moq.pro/anon";
          const ROOM = "os-in-browser-webrtc-test";
          const STUN = "stun:stun.l.google.com:19302";

          console.log("Connecting to MoQ...");

          const connection = await Moq.Connection.connect(
            new URL(RELAY)
          );

          console.log("MoQ connected");

          const path = Moq.Path.from(ROOM);

          /*
           * One broadcast:
           *
           *   browser -> host
           *   host    -> browser
           *
           * Each direction has its own track.
           */
          const broadcast = new Moq.Broadcast.Producer();

          connection.publish(path, broadcast);

          const browserToHost = broadcast.createTrack(
            "browser-to-host"
          );

          const hostToBrowser = broadcast.createTrack(
            "host-to-browser"
          );

          console.log(`Broadcast: ${ROOM}`);
          console.log("Waiting for browser...");

          /*
           * WebRTC host.
           *
           * STUN only.
           * No TURN server.
           */
          const pc = new RTCPeerConnection({
            iceServers: [
              {
                urls: STUN,
              },
            ],
          });

          pc.ondatachannel = ({ channel }) => {
            console.log("WebRTC DataChannel:", channel.label);

            channel.onmessage = ({ data }) => {
              /*
               * Echo timestamp back to browser.
               *
               * This is what the browser uses to measure
               * actual WebRTC RTT.
               */
              channel.send(data);
            };

            channel.onopen = () => {
              console.log("WebRTC DataChannel OPEN");
            };

            channel.onclose = () => {
              console.log("WebRTC DataChannel CLOSED");
            };
          };

          /*
           * Read signaling messages from the browser.
           */
          const consumer = broadcast
            .track("browser-to-host")
            .subscribe({
              priority: 100,
            });

          console.log("Subscribed to browser signaling");

          for (;;) {
            const group = await consumer.recvGroup();

            if (!group)
              break;

            for (;;) {
              const frame = await group.readFrame();

              if (!frame)
                break;

              const message = JSON.parse(
                new TextDecoder().decode(frame.payload)
              );

              console.log("Signaling:", message.type);

              if (message.type === "offer") {
                await pc.setRemoteDescription(
                  message.description
                );

                const answer = await pc.createAnswer();

                await pc.setLocalDescription(answer);

                hostToBrowser.writeJson({
                  type: "answer",
                  description: pc.localDescription,
                });

                console.log("Sent answer");
              }

              if (message.type === "candidate") {
                await pc.addIceCandidate(
                  message.candidate
                );
              }
            }
          }
          EOF

          node host.mjs

      - name: Keep alive
        run: sleep 21600
