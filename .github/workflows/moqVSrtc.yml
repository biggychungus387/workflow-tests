name: MoQ vs WebRTC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install
        run: npm install @moq/net werift

      - name: Start benchmark host
        run: |
          cat > host.mjs <<'EOF'
          import * as Moq from "@moq/net";
          import { RTCPeerConnection } from "werift";

          const RELAY = "https://cdn.moq.pro/anon";

          // Static IDs.
          const MOQ_TEST = "os-in-browser-moq-latency";
          const SIGNAL = "os-in-browser-webrtc-signaling";

          const BROWSER_TO_HOST = "browser-to-host";
          const HOST_TO_BROWSER = "host-to-browser";

          console.log("Connecting to MoQ Pro...");

          const connection = await Moq.Connection.connect(
            new URL(RELAY)
          );

          console.log("✓ MoQ connected");

          /*
           * ============================================================
           * MOQT ECHO
           * ============================================================
           *
           * Browser publishes:
           *
           *   os-in-browser-moq-latency/browser
           *
           * Host consumes it and echoes every frame through:
           *
           *   os-in-browser-moq-latency/host
           */

          const browserPath =
            Moq.Path.from(`${MOQ_TEST}/browser`);

          const hostPath =
            Moq.Path.from(`${MOQ_TEST}/host`);

          const hostBroadcast =
            new Moq.Broadcast.Producer();

          connection.publish(
            hostPath,
            hostBroadcast
          );

          const hostTrack =
            hostBroadcast.createTrack("echo");

          const browserConsumer =
            connection
              .consume(browserPath)
              .track("echo")
              .subscribe({
                priority: 100,
              });

          console.log("✓ MoQ echo endpoint ready");

          /*
           * Echo MoQ latency packets.
           */
          (async () => {
            for (;;) {
              const group =
                await browserConsumer.recvGroup();

              if (!group)
                break;

              for (;;) {
                const frame =
                  await group.readFrame();

                if (!frame)
                  break;

                hostTrack.writeFrame(
                  frame.timestamp,
                  frame.payload
                );
              }
            }
          })().catch(console.error);

          /*
           * ============================================================
           * WEBRTC
           * ============================================================
           */

          const signalPath =
            Moq.Path.from(SIGNAL);

          const signalBroadcast =
            new Moq.Broadcast.Producer();

          connection.publish(
            signalPath,
            signalBroadcast
          );

          const signalTrack =
            signalBroadcast.createTrack("signal");

          const signalConsumer =
            connection
              .consume(
                Moq.Path.from(SIGNAL + "/browser")
              )
              .track("signal")
              .subscribe({
                priority: 100,
              });

          console.log("✓ WebRTC signaling ready");

          const pc = new RTCPeerConnection({
            iceServers: [
              {
                urls: "stun:stun.l.google.com:19302",
              },
            ],
          });

          /*
           * WebRTC DataChannel echo.
           */
          pc.ondatachannel = ({ channel }) => {
            console.log(
              "WebRTC DataChannel:",
              channel.label
            );

            channel.onopen = () => {
              console.log(
                "✓ WebRTC DataChannel OPEN"
              );
            };

            channel.onmessage = ({ data }) => {
              channel.send(data);
            };
          };

          /*
           * Wait until ICE gathering completes.
           *
           * This means we can send one complete SDP instead
           * of implementing trickle ICE in the benchmark.
           */
          function waitForIceGathering(pc) {
            if (
              pc.iceGatheringState === "complete"
            ) {
              return Promise.resolve();
            }

            return new Promise(resolve => {
              const previous =
                pc.onicegatheringstatechange;

              pc.onicegatheringstatechange = event => {
                previous?.(event);

                if (
                  pc.iceGatheringState ===
                  "complete"
                ) {
                  resolve();
                }
              };
            });
          }

          /*
           * Receive signaling from browser.
           */
          (async () => {
            for (;;) {
              const group =
                await signalConsumer.recvGroup();

              if (!group)
                break;

              for (;;) {
                const frame =
                  await group.readFrame();

                if (!frame)
                  break;

                const message =
                  JSON.parse(
                    new TextDecoder().decode(
                      frame.payload
                    )
                  );

                console.log(
                  "← signaling:",
                  message.type
                );

                if (
                  message.type === "offer"
                ) {
                  await pc.setRemoteDescription(
                    message.description
                  );

                  const answer =
                    await pc.createAnswer();

                  await pc.setLocalDescription(
                    answer
                  );

                  await waitForIceGathering(
                    pc
                  );

                  signalTrack.writeFrame(
                    0,
                    new TextEncoder().encode(
                      JSON.stringify({
                        type: "answer",
                        description:
                          pc.localDescription,
                      })
                    )
                  );

                  console.log(
                    "→ answer sent"
                  );
                }
              }
            }
          })().catch(console.error);

          pc.onconnectionstatechange = () => {
            console.log(
              "WebRTC connection:",
              pc.connectionState
            );
          };

          pc.oniceconnectionstatechange = () => {
            console.log(
              "WebRTC ICE:",
              pc.iceConnectionState
            );
          };

          console.log("");
          console.log(
            "========================================"
          );
          console.log(
            "Benchmark host is ready."
          );
          console.log(
            "========================================"
          );
          console.log("");
          console.log(
            "MoQ test:"
          );
          console.log(
            `  ${MOQ_TEST}/browser`
          );
          console.log("");
          console.log(
            "WebRTC signaling:"
          );
          console.log(
            `  ${SIGNAL}`
          );
          console.log("");
          console.log(
            "Waiting for browser..."
          );

          /*
           * Keep the process alive.
           */
          await new Promise(() => {});
          EOF

          node host.mjs

      - name: Keep runner alive
        run: sleep 21600
